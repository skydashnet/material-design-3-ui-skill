name: Feature request
description: Suggest a new rule, component, workflow, or repository improvement.
title: '[Feature]: '
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: Use this form for improvements that are not corrections to existing Material guidance.
- type: textarea
  id: problem
  attributes:
    label: Problem or opportunity
    description: What is currently missing or difficult?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed improvement
    description: What should be added or changed?
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    options:
    - Material 3 foundations / tokens
    - Components
    - Adaptive layout
    - Accessibility
    - Interaction / states
    - Motion
    - Material 3 Expressive
    - Platform implementation
    - Documentation / repository
  validations:
    required: true
- type: textarea
  id: references
  attributes:
    label: References
    description: Add official Material/Android/Google Design links when relevant.
  validations:
    required: false
- type: textarea
  id: behavior
  attributes:
    label: Expected agent behavior
    description: Give a short example of how this should improve an agent's UI decision.
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: Checklist
    options:
    - label: I searched existing issues for similar requests.
      required: true
    - label: This proposal is compatible with the project's Material 3-first scope.
      required: true
